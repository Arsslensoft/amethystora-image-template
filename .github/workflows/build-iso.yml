# Builds the two ISOs of your published image, as Amethystora builds its own: <image>.iso, the live ISO, which
# starts Amethystora from a USB stick to try and installs from there, offline, and <image>-non-uefi.iso, the
# installer, the only one that also starts computers without UEFI. Both install your image and switch the
# machine to take its updates from your registry, signature-checked with cosign.pub.
#
# Run it from the Actions tab (Build ISO, Run workflow) once your image is published. It uses Amethystora's own
# installer files (its iso/ folder), at the commit AMETHYSTORA_REF names, so that what installs your image is
# what installs Amethystora's.
#
# Each ISO and its checksum, signed with your SIGNING_SECRET, are kept as the run's artifacts for a week:
# GitHub Releases take no file over 2 GiB. With the four storage secrets set (any S3-compatible storage, such
# as Cloudflare R2: STORAGE_ENDPOINT, STORAGE_BUCKET, STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY), they
# are uploaded there too, each replacing the last under the same name.
name: Build ISO

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  # Amethystora's installer files: iso/, and the LICENSE and NOTICE the ISOs carry
  AMETHYSTORA_REF: b5943daa39b8d421ad009a758e04284d0a40e1fa # main

jobs:
  image:
    name: Image
    # The template itself publishes no image
    if: github.repository != 'iarsslen/amethystora-image-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repository: ${{ steps.verify.outputs.repository }}
      digest: ${{ steps.verify.outputs.digest }}
      name: ${{ steps.verify.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # Everything on both ISOs is your published image, so it is checked first against your key, by the
      # digest both builds then use
      - name: Verify your image
        id: verify
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY#*/}"
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${name,,}"
          digest="$(skopeo inspect --retry-times 3 "docker://${repository}:stable" | jq -r .Digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign verify --key cosign.pub "${repository}@${digest}" >/dev/null
          {
            echo "repository=${repository}"
            echo "digest=${digest}"
            echo "name=${name,,}"
          } >>"${GITHUB_OUTPUT}"

  installer-iso:
    name: Installer ISO
    needs: [image]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      REPOSITORY: ${{ needs.image.outputs.repository }}
      DIGEST: ${{ needs.image.outputs.digest }}
      ISO: ${{ needs.image.outputs.name }}-non-uefi.iso
    steps:
      - name: Make room
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10
        with:
          remove-codeql: true

      - name: Amethystora's installer files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iarsslen/amethystora
          ref: ${{ env.AMETHYSTORA_REF }}
          persist-credentials: false

      - name: Point the installer at your image
        run: |
          set -euo pipefail
          sed -i "s|@IMAGE@|${REPOSITORY}|" iso/iso.toml
          # The machine it installs takes updates signature-checked from the first one
          if grep -E "^[^#]*bootc switch" iso/iso.toml | grep -v -- "--enforce-container-sigpolicy"; then
            echo "::error::iso.toml switches the installed machine without signature checking"
            exit 1
          fi
          grep -qF -- "--enforce-container-sigpolicy --transport registry ${REPOSITORY}:stable" iso/iso.toml

      # As Amethystora's own workflow builds it (its .github/workflows/build-iso.yml says why each line is
      # there): bootc-image-builder pinned by digest, Fedora's definitions under Amethystora's ID with the
      # generic logo and release packages, and your image pulled by the digest the image job checked
      - name: Build the ISO
        env:
          BUILDER: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
        run: |
          set -euo pipefail
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' |
            sudo tee /etc/containers/storage.conf >/dev/null
          if [[ -e /etc/apparmor.d/bwrap-userns-restrict ]]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo podman pull "${BUILDER}"
          sudo podman pull "${REPOSITORY}@${DIGEST}"
          sudo podman tag "${REPOSITORY}@${DIGEST}" "${REPOSITORY}:stable"
          mkdir output
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume ./output:/output \
            --volume ./iso/iso.toml:/config.toml:ro \
            --entrypoint /bin/bash "${BUILDER}" -c '
              set -euo pipefail
              cd /usr/share/bootc-image-builder/defs
              for def in fedora-*.yaml; do
                { cat "${def}"; printf "    - generic-logos\n    - generic-release\n"; } > "amethystora-${def#fedora-}"
              done
              exec bootc-image-builder "$@"' bash \
            build --output /output --type anaconda-iso --rootfs btrfs --use-librepo=True \
              --chown "$(id -u):$(id -g)" "${REPOSITORY}:stable"

      # Fails, before anything is kept, if Fedora's logo or release package is in the installer
      - name: List the installer's packages
        run: python3 iso/installer-packages.py output/manifest-anaconda-iso.json >INSTALLER-PACKAGES

      - name: Add the installer's look and the licences
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio isomd5sum xorriso
          (cd iso/product && find . -mindepth 1 | LC_ALL=C sort | cpio --quiet -o -H newc -R 0:0 | gzip -9) >product.img
          mkdir upload
          xorriso -indev output/bootiso/install.iso -outdev "upload/${ISO}" -boot_image any replay \
            -map product.img /images/product.img -map LICENSE /LICENSE -map NOTICE /NOTICE \
            -map INSTALLER-PACKAGES /INSTALLER-PACKAGES
          implantisomd5 --force "upload/${ISO}"

      - name: Hand the ISO to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: upload/${{ env.ISO }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  live-iso:
    name: Live ISO
    needs: [image]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      REPOSITORY: ${{ needs.image.outputs.repository }}
      DIGEST: ${{ needs.image.outputs.digest }}
      ISO: ${{ needs.image.outputs.name }}.iso
    steps:
      - name: Make room
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10
        with:
          remove-codeql: true

      - name: Amethystora's installer files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iarsslen/amethystora
          ref: ${{ env.AMETHYSTORA_REF }}
          persist-credentials: false

      # The live system and the copy it installs are both the digest the image job checked
      - name: Build the live system
        run: |
          set -euo pipefail
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' |
            sudo tee /etc/containers/storage.conf >/dev/null
          sudo podman pull "${REPOSITORY}@${DIGEST}"
          sudo podman build --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE_IMAGE="${REPOSITORY}:stable" --build-arg BASE_DIGEST="${DIGEST}" \
            --tag localhost/image-live:stable --file iso/live/Containerfile iso

      - name: Pin the Fedora Titanoboa builds in
        run: |
          set -euo pipefail
          fedora="$(sed -nE 's/^fedora_image := "([^"]+):[^:@"]+@(sha256:[a-f0-9]{64})"$/\1@\2/p' Justfile)"
          [[ -n "${fedora}" ]]
          sudo podman pull "${fedora}"
          sudo podman tag "${fedora}" quay.io/fedora/fedora:latest

      - name: Build the ISO
        id: titanoboa
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main
        with:
          image-ref: localhost/image-live:stable

      - name: List the live system's packages
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint rpm localhost/image-live:stable \
            -qa --queryformat '%{NAME}\t%{VERSION}-%{RELEASE}\t%{LICENSE}\n' | sort >LIVE-PACKAGES
          if awk -F'\t' '$1 == "fedora-logos" || $1 ~ /^fedora-release/ { found = 1 } END { exit !found }' LIVE-PACKAGES; then
            echo "::error::The live system carries Fedora's logo or release package"
            exit 1
          fi

      - name: Add the licences
        env:
          LIVE_ISO: ${{ steps.titanoboa.outputs.iso-dest }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso
          mkdir upload
          xorriso -indev "${LIVE_ISO}" -outdev "upload/${ISO}" -boot_image any replay \
            -map LICENSE /LICENSE -map NOTICE /NOTICE -map LIVE-PACKAGES /LIVE-PACKAGES

      - name: Hand the ISO to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: upload/${{ env.ISO }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  # On a runner of its own, which ran none of the privileged builders: the only place your key is
  publish:
    name: Publish ${{ matrix.kind }}
    needs: [image, installer-iso, live-iso]
    if: ${{ !cancelled() && (needs.installer-iso.result == 'success' || needs.live-iso.result == 'success') }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        kind: [installer, live]
    steps:
      - name: Name
        env:
          NAME: ${{ needs.image.outputs.name }}
          KIND: ${{ matrix.kind }}
        run: |
          if [[ "${KIND}" == installer ]]; then echo "ISO=${NAME}-non-uefi.iso" >>"${GITHUB_ENV}"; else echo "ISO=${NAME}.iso" >>"${GITHUB_ENV}"; fi

      - name: Download the ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ISO }}
          path: upload

      - name: Checksum
        working-directory: upload
        run: |
          test -f "${ISO}"
          sha256sum "${ISO}" | tee "${ISO}.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the checksum
        working-directory: upload
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          if [[ -z "${COSIGN_PRIVATE_KEY}" ]]; then
            echo "::error::The secret SIGNING_SECRET is not set: README.md says how."
            exit 1
          fi
          cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY --bundle "${ISO}.sha256.bundle" "${ISO}.sha256"

      - name: Keep it for a week
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ISO }}-signed
          path: upload/
          if-no-files-found: error
          retention-days: 7

      - name: Upload to your storage
        working-directory: upload
        env:
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [[ -z "${STORAGE_ENDPOINT}" || -z "${STORAGE_BUCKET}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "No storage secrets: the ISO is kept as this run's artifact only."
            exit 0
          fi
          # The ISO first, so that the checksum is never replaced before the ISO it describes
          for file in "${ISO}" "${ISO}.sha256" "${ISO}.sha256.bundle"; do
            aws s3 cp --no-progress --endpoint-url "${STORAGE_ENDPOINT}" "${file}" "s3://${STORAGE_BUCKET}/${file}"
          done
